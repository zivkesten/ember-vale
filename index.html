function drawWin(g){drawScene(g);g.fillStyle='rgba(10,10,18,.66)';g.fillRect(0,0,VW,VH);drawText(g,'THE BEACON BURNS AGAIN',VW/2-textWidth('THE BEACON BURNS AGAIN',2)/2,54,'#ffd858',2,'#5c1810');drawText(g,'WARLORD BRANN IS FELLED',VW/2-textWidth('WARLORD BRANN IS FELLED')/2,84,'#fff2c8',1);drawText(g,'FINAL SCORE '+score,VW/2-textWidth('FINAL SCORE '+score)/2,104,'#5cc8f0',1);if(Math.floor(clock/16)%2)drawText(g,'PRESS ATTACK TO PLAY AGAIN',VW/2-textWidth('PRESS ATTACK TO PLAY AGAIN')/2,132,'#fff2c8',1)}

/* ---------- input, menus, main loop ---------- */
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const controls=Object.create(null);
const keymap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',j:'attack',k:'jump',l:'magic',p:'pause',' ':'attack',Enter:'attack'};
function pressAttack(){sfxInit();if(state==='title'){state='select';sSelect()}else if(state==='select'){resetGame();sSelect()}else if(state==='play')doAttack();else if(state==='over'||state==='win'){state='title';sSelect()}}
function pressJump(){sfxInit();if(state==='play')doJump()}
function pressMagic(){sfxInit();if(state==='play')doMagic()}
function pressPause(){if(state==='play'){paused=!paused;sSelect()}}
addEventListener('keydown',e=>{const k=keymap[e.key]||keymap[e.key.toLowerCase?.()];if(!k)return;e.preventDefault();if(e.repeat){if(k==='left'||k==='right'||k==='up'||k==='down')controls[k]=true;return}if(k==='pause')pressPause();else if(k==='attack')pressAttack();else if(k==='jump')pressJump();else if(k==='magic')pressMagic();else controls[k]=true});
addEventListener('keyup',e=>{const k=keymap[e.key]||keymap[e.key.toLowerCase?.()];if(k)controls[k]=false});
addEventListener('blur',()=>{for(const k in controls)controls[k]=false;if(state==='play'&&!paused)pressPause()});
for(const btn of document.querySelectorAll('[data-key]')){const active=new Set();const key=btn.dataset.key;btn.addEventListener('pointerdown',e=>{e.preventDefault();sfxInit();btn.setPointerCapture(e.pointerId);active.add(e.pointerId);if(key==='attack')pressAttack();else if(key==='jump')pressJump();else if(key==='magic')pressMagic();else controls[key]=true;btn.classList.add('down')});for(const ev of['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(ev,e=>{active.delete(e.pointerId);if(!active.size){controls[key]=false;btn.classList.remove('down')}})}
canvas.addEventListener('pointerdown',e=>{sfxInit();const r=canvas.getBoundingClientRect();const ax=(e.clientX-r.left)/r.width*VW,ay=(e.clientY-r.top)/r.height*VH;if(state==='title'){state='select';sSelect();return}if(state==='select'){const heroes=['barbarian','dwarf','amazon'];for(let i=0;i<3;i++){const x=VW/2-52+i*52;if(Math.abs(ax-x)<24&&ay>80&&ay<150){if(heroSel===heroes[i]){resetGame();sSelect()}else{heroSel=heroes[i];sSelect()}return}}heroSel=heroes[Math.max(0,Math.min(2,Math.floor((ax-(VW/2-76))/52)))];sSelect();return}if(state==='over'||state==='win'){state='title';sSelect()}});
const frame=document.querySelector('.frame'),pauseBtn=document.createElement('button');pauseBtn.textContent='II';pauseBtn.setAttribute('aria-label','Pause');pauseBtn.style.cssText='position:absolute;top:6px;right:6px;z-index:5;background:#1c1620cc;color:#f4c542;border:2px solid #a4744e;border-radius:4px;font-weight:900;font-size:12px;padding:2px 8px';pauseBtn.addEventListener('pointerdown',e=>{e.preventDefault();pressPause()});frame.appendChild(pauseBtn);
let last=0;function loop(ts){const dt=last?Math.min(2.5,(ts-last)/16.667):1;last=ts;if(!paused){if(state==='intro'){introT-=dt;if(introT<=0)state='play'}update(dt)}bg.clearRect(0,0,VW,VH);if(state==='title')drawTitleScreen(bg);else if(state==='select')drawSelect(bg);else if(state==='intro')drawIntro(bg);else if(state==='over')drawOver(bg);else if(state==='win')drawWin(bg);else if(paused)drawPaused(bg);else drawScene(bg);ctx.imageSmoothingEnabled=false;ctx.drawImage(buf,0,0,canvas.width,canvas.height);requestAnimationFrame(loop)}requestAnimationFrame(loop);
